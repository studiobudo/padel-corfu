<meta name="robots" content="noindex, nofollow">

<style>
/* ==========================================================================
   POLICES DE MARQUE (hébergées en local, aucun CDN)
   ========================================================================== */
/* The Seasons (version démo) : seuls les glyphes sûrs sont utilisés ; accents, « 4 », tirets, etc. basculent sur Playfair Display */
@font-face{font-family:'The Seasons';src:url('destination/fonts/the-seasons.woff2') format('woff2');font-weight:400 900;font-display:swap;unicode-range:U+20,U+2C,U+2E,U+30-33,U+35-3B,U+3F,U+41-5A,U+61-7A}
@font-face{font-family:'Mistrully';src:url('destination/fonts/mistrully.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Playfair Display';src:url('destination/fonts/playfair-display-latin-400-normal.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Playfair Display';src:url('destination/fonts/playfair-display-latin-400-italic.woff2') format('woff2');font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:'Poppins';src:url('destination/fonts/poppins-latin-400-normal.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Poppins';src:url('destination/fonts/poppins-latin-500-normal.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Poppins';src:url('destination/fonts/poppins-latin-600-normal.woff2') format('woff2');font-weight:600;font-display:swap}

/* ==========================================================================
   TOKENS (charte Kerkyra Work & Play)
   ========================================================================== */
:root{
  --teal:#008a95;--teal-light:#00a8ba;--teal-dark:#006671;--teal-deep:#00505a;--abyss:#003d47;
  --gold:#e0b12a;--gold-light:#f0d97a;--gold-pale:#f5e5b8;
  --ink:#0d3b42;--cream:#FAF8F3;--white:#fff;--muted:#5d7a7f;--line:rgba(13,59,66,.14);
  --font-display:'The Seasons','Playfair Display',Georgia,serif;
  --font-serif:'Playfair Display',Georgia,serif;
  --font-num:'Playfair Display',Georgia,serif; /* chiffres : The Seasons démo n'a pas de « 4 » */
  --font-script:'Mistrully','Playfair Display',Georgia,serif;
  --font-body:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --pad:22px;--radius:6px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --shadow:0 10px 15px rgba(0,0,0,.1);
}

/* ==========================================================================
   BASE
   ========================================================================== */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font-body);font-size:16px;line-height:1.6;color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased}
main{overflow-x:clip}
img{display:block;max-width:100%}
h1,h2,h3,p,figure,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 var(--pad)}
.section{padding:84px 0}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--teal)}
.eyebrow::before{content:"";width:34px;height:1px;background:var(--gold)}
.h2{font-family:var(--font-display);font-weight:400;font-size:clamp(34px,9.4vw,58px);line-height:1.12;margin-top:14px;text-wrap:balance}
.h2 em{font-family:var(--font-script);font-style:normal;color:var(--gold);font-size:1.1em;line-height:1;padding-right:.08em}
.lead{margin-top:16px;max-width:56ch;color:var(--muted)}
.on-dark{color:#fff}
.on-dark .eyebrow{color:var(--gold-light)}
.on-dark .lead{color:rgba(255,255,255,.78)}

/* Barre de progression de lecture */
.progress{position:fixed;inset:0 0 auto 0;height:3px;background:var(--gold);transform-origin:0 50%;transform:scaleX(var(--sp,0));z-index:60;pointer-events:none}

/* Apparitions au scroll (actives seulement si le JS tourne) */
.js .rv{opacity:0;transform:translateY(30px);transition:opacity .9s ease-out,transform .9s var(--ease);transition-delay:calc(var(--d,0)*90ms)}
.js .rv.in{opacity:1;transform:none}
/* Le masque est porté par l'image (un élément entièrement masqué ne déclenche pas l'observateur) */
.js .rv-img img{clip-path:inset(0 0 100% 0);transform:scale(1.12);transition:clip-path 1.2s var(--ease),transform 1.6s var(--ease)}
.js .rv-img.in img{clip-path:inset(0);transform:none}

/* ==========================================================================
   HERO — titre animé « Destination Corfou 2027 »
   ========================================================================== */
.hero{position:relative;height:100svh;min-height:600px;overflow:hidden;background:var(--abyss);color:#fff;display:flex;flex-direction:column}
.hero-bg{position:absolute;inset:-4% 0 0 0;will-change:transform;transform:translate3d(0,calc(var(--hp,0)*9%),0) scale(calc(1 + var(--hp,0)*.12))}
.hero-bg img{width:100%;height:100%;object-fit:cover;object-position:62% 50%;animation:kenburns 22s ease-out both}
@keyframes kenburns{from{transform:scale(1.22)}to{transform:scale(1.02)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,61,71,.62) 0%,rgba(0,61,71,.22) 26%,rgba(0,61,71,.46) 56%,rgba(0,61,71,.92) 100%);pointer-events:none}
.hero-top{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) var(--pad) 0}
.hero-logo img{height:44px;width:auto}
.langsw{display:flex;border:1px solid rgba(255,255,255,.45);border-radius:999px;overflow:hidden;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);background:rgba(0,61,71,.25)}
.langsw button{border:0;background:transparent;color:#fff;font-size:12px;font-weight:600;letter-spacing:.06em;padding:8px 12px;min-height:36px}
.langsw button[aria-pressed="true"]{background:#fff;color:var(--teal-dark)}
.hero-in{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 var(--pad) 96px;will-change:transform,opacity;transform:translate3d(0,calc(var(--hp,0)*-90px),0);opacity:calc(1 - var(--hp,0)*1.5)}
.hero-kicker{font-size:11.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#fff;display:flex;align-items:center;gap:12px;text-shadow:0 1px 12px rgba(0,61,71,.6)}
.hero-kicker::before{content:"";width:0;height:1px;background:var(--gold);animation:rule 1s .3s var(--ease) forwards}
@keyframes rule{to{width:40px}}
.hero-title{font-weight:400;margin-top:10px;line-height:.9}
.ht-script{display:block;font-family:var(--font-script);font-size:clamp(46px,min(14vw,13svh),112px);line-height:1.15;color:var(--gold);margin:0 0 -.14em .04em;position:relative;z-index:1;clip-path:inset(-20% 100% -20% 0);animation:write 1.5s .45s cubic-bezier(.6,.1,.3,1) forwards;text-shadow:0 2px 18px rgba(0,61,71,.45)}
@keyframes write{to{clip-path:inset(-20% -5% -20% 0)}}
.ht-main{display:block;font-family:var(--font-display);font-size:clamp(84px,min(25.5vw,25svh),230px);letter-spacing:-.01em;overflow:hidden;padding:.06em 0 .04em;margin-left:-.04em;text-shadow:0 4px 40px rgba(0,61,71,.35)}
.ht-main .ch{display:inline-block;transform:translateY(112%) rotate(7deg);transform-origin:0 100%;animation:rise 1.15s var(--ease) forwards;animation-delay:calc(.75s + var(--i)*75ms)}
@keyframes rise{to{transform:none}}
:lang(el) .ht-main{font-size:clamp(60px,min(17.5vw,22svh),170px)}
:lang(el) .ht-script{font-family:var(--font-serif);font-style:italic;font-size:clamp(34px,9.5vw,80px);margin-bottom:0}
.ht-year{display:flex;align-items:center;gap:16px;margin-top:.02em}
.ht-year::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),rgba(224,177,42,0));transform-origin:0 50%;transform:scaleX(0);animation:line 1.6s 1.9s var(--ease) forwards}
@keyframes line{to{transform:scaleX(1)}}
.ht-digits{display:flex;font-family:var(--font-display);font-size:clamp(70px,min(21vw,20svh),190px);line-height:1;color:transparent;-webkit-text-stroke:1.4px var(--gold);animation:fill 1.2s 2.5s ease-out forwards}
@keyframes fill{to{color:var(--gold)}}
.ht-digits .dg{display:block;height:1em;overflow:hidden}
.ht-digits .dg span{display:block;height:1em;transform:translateY(0);animation:roll 1.5s cubic-bezier(.3,.8,.2,1) forwards;animation-delay:calc(1.25s + var(--i)*110ms)}
.ht-digits .dg b{display:block;height:1em;font-weight:400}
@keyframes roll{to{transform:translateY(calc(var(--n)*-1em))}}
.hero-sub{margin-top:20px;max-width:34ch;font-size:15.5px;color:rgba(255,255,255,.9);opacity:0;animation:fadeup 1s 2.2s var(--ease) forwards}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.hero-coords{position:absolute;right:var(--pad);bottom:104px;z-index:2;writing-mode:vertical-rl;font-size:10.5px;letter-spacing:.3em;color:rgba(255,255,255,.7);opacity:calc(1 - var(--hp,0)*3)}
.hero-scroll{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));z-index:3;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.8);opacity:calc(1 - var(--hp,0)*4)}
.hero-scroll i{display:block;width:1px;height:38px;background:rgba(255,255,255,.3);position:relative;overflow:hidden}
.hero-scroll i::after{content:"";position:absolute;inset:0;background:var(--gold);animation:drop 2s ease-in-out infinite}
@keyframes drop{0%{transform:translateY(-100%)}60%,100%{transform:translateY(100%)}}

/* ==========================================================================
   MANIFESTE — phrase qui s'illumine mot à mot au scroll
   ========================================================================== */
.manifesto{padding:96px 0 84px}
.manifesto p.words{font-family:var(--font-serif);font-size:clamp(27px,7.6vw,50px);line-height:1.28;max-width:20ch;text-wrap:pretty}
.manifesto .w{color:rgba(13,59,66,.16);transition:color .5s ease-out}
.manifesto .w.on{color:var(--ink)}
.manifesto .w.on.hl{color:var(--teal)}
.manifesto .sign{font-family:var(--font-script);font-size:44px;line-height:1.2;color:var(--gold);margin-top:26px}
.manifesto .sign small{display:block;font-family:var(--font-body);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:2px}

/* ==========================================================================
   INFOGRAPHIES — 2 h 45, météo, 13 villes, repères
   ========================================================================== */
.figures{background:linear-gradient(160deg,var(--teal) 0%,var(--abyss) 62%);padding-bottom:0}
.big{font-family:var(--font-num);font-variant-numeric:lining-nums;font-size:clamp(96px,30vw,210px);line-height:.95;color:#fff;letter-spacing:-.01em;white-space:nowrap}
.big small{font-size:.36em;color:var(--gold);letter-spacing:0;margin:0 .12em 0 .06em}
.big-label{font-size:18px;font-weight:500;margin-top:6px;color:#fff}
.note{font-size:14px;color:rgba(255,255,255,.72);max-width:44ch;margin-top:10px}

/* -- Vol : arc tracé au scroll -- */
.flight{margin-top:40px}
.flight svg{width:100%;height:auto;display:block;overflow:visible;margin-top:8px}
.flight .arc-bg{fill:none;stroke:rgba(255,255,255,.22);stroke-width:1.5;stroke-dasharray:2 7;stroke-linecap:round}
.flight .arc{fill:none;stroke:var(--gold);stroke-width:2.2;stroke-linecap:round}
.flight text{font-family:var(--font-body);font-size:11px;font-weight:600;letter-spacing:.2em;fill:#fff}
.flight .sub{font-size:9px;font-weight:400;letter-spacing:.08em;fill:rgba(255,255,255,.65)}

/* -- Météo : soleil + barres mensuelles -- */
.weather{margin-top:84px;background:var(--cream);color:var(--ink);position:relative;overflow:hidden;padding:44px var(--pad) 34px}
.weather .eyebrow{color:var(--teal)}
.sun{position:absolute;top:-70px;right:-70px;width:230px;height:230px;pointer-events:none;transform:translate3d(0,calc((1 - var(--wp,1))*90px),0)}
.sun svg{width:100%;height:100%;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.weather h3{font-family:var(--font-display);font-weight:400;font-size:clamp(30px,8.4vw,46px);line-height:1.12;margin-top:12px;max-width:11ch;position:relative}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:210px;margin-top:34px;position:relative}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bar b{font-family:var(--font-num);font-variant-numeric:lining-nums;font-weight:400;font-size:19px;line-height:1;margin-bottom:6px;opacity:0;transition:opacity .6s ease-out;transition-delay:calc(.5s + var(--i)*80ms)}
.bar i{display:block;width:100%;height:calc(var(--h)*1%);background:rgba(0,138,149,.2);transform-origin:50% 100%;transform:scaleY(0);transition:transform 1.1s var(--ease);transition-delay:calc(var(--i)*80ms)}
.bar.best i{background:linear-gradient(180deg,var(--gold) 0%,var(--gold-light) 100%)}
.bar span{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.bars.in .bar i{transform:none}
.bars.in .bar b{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:18px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px}
.legend span::before{content:"";width:12px;height:12px;background:rgba(0,138,149,.2)}
.legend .lg-best::before{background:var(--gold)}
.wfacts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:26px}
.wfacts div{background:var(--cream);padding:16px 14px}
.wfacts b{display:block;font-family:var(--font-num);font-variant-numeric:lining-nums;font-weight:400;font-size:30px;line-height:1.1;color:var(--teal)}
.wfacts span{font-size:13px;color:var(--muted);line-height:1.4;display:block;margin-top:4px}
.fine{font-size:11.5px;color:var(--muted);margin-top:14px}

/* -- 13 villes : carte et liaisons -- */
.cities{padding-top:84px;padding-bottom:70px}
.map{margin:22px 0 0}
.map svg{width:100%;height:auto;display:block;overflow:visible}
.map .land{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.38);stroke-width:1.2;stroke-linejoin:round}
.map .route{fill:none;stroke:var(--gold);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:.85;transition:stroke-dashoffset 1.5s var(--ease);transition-delay:calc(.2s + var(--i)*90ms)}
.map .city{fill:#fff;transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .5s var(--ease);transition-delay:calc(var(--i)*90ms)}
.map.in .route{stroke-dashoffset:0}
.map.in .city{transform:none}
.map .cfu{fill:var(--gold)}
.map .cfu-ring{fill:none;stroke:var(--gold);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
@keyframes ping{from{transform:scale(.6);opacity:.9}to{transform:scale(3);opacity:0}}
.map text{font-family:var(--font-body);font-size:15px;font-weight:600;letter-spacing:.2em;fill:var(--gold-light)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid rgba(255,255,255,.34);border-radius:999px;padding:6px 13px;font-size:13.5px;line-height:1.3}
.country{margin-top:22px}
.country h4{margin:0;font-size:11.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-light)}
.linkline{display:inline-flex;align-items:center;gap:10px;margin-top:28px;font-weight:500;text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:4px;min-height:44px}
.linkline svg{width:18px;height:18px;transition:transform .25s ease-out}
.linkline:hover svg{transform:translateX(4px)}

/* -- Repères -- */
.facts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(255,255,255,.2)}
.fact{padding:26px 14px 26px 0;border-bottom:1px solid rgba(255,255,255,.2)}
.fact:nth-child(odd){border-right:1px solid rgba(255,255,255,.2)}
.fact:nth-child(even){padding-left:18px}
.fact b{display:block;font-family:var(--font-num);font-variant-numeric:lining-nums;font-weight:400;font-size:38px;line-height:1.05;color:var(--gold)}
.fact span{display:block;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,.8);margin-top:6px}

/* ==========================================================================
   BANDEAUX PHOTO (parallaxe)
   ========================================================================== */
.band{position:relative;height:74svh;min-height:420px;overflow:hidden;background:var(--abyss);color:#fff;display:flex;align-items:flex-end}
.band img{position:absolute;left:0;top:-14%;width:100%;height:128%;object-fit:cover;will-change:transform;transform:translate3d(0,calc(var(--pp,0)*11%),0)}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,61,71,0) 45%,rgba(0,61,71,.82) 100%)}
.band figcaption{position:relative;z-index:1;padding:0 var(--pad) 34px;max-width:1080px;width:100%;margin:0 auto}
.band figcaption b{display:block;font-family:var(--font-display);font-weight:400;font-size:clamp(30px,8.4vw,52px);line-height:1.12;max-width:14ch}
.band figcaption span{display:block;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-light);margin-bottom:10px}

/* ==========================================================================
   CARROUSELS D'ACTIVITÉS (scroll-snap + effets liés au défilement)
   ========================================================================== */
.acts{padding:84px 0 70px;background:var(--cream)}
.acts.alt{background:#fff}
.car{margin-top:34px;position:relative}
.car-track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px max(var(--pad),calc((100vw - min(78vw,340px))/2)) 22px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.car-track::-webkit-scrollbar{display:none}
.slide{flex:0 0 min(78vw,340px);scroll-snap-align:center;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;transform:scale(calc(1 - var(--dist,0)*.06));opacity:calc(1 - var(--dist,0)*.4);transition:transform .2s linear,opacity .2s linear}
.acts.alt .slide{background:var(--cream)}
.slide-img{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--teal-deep)}
.slide-img img{position:absolute;inset:0 -9%;width:118%;max-width:none;height:100%;object-fit:cover;transform:translate3d(calc(var(--px,0)*7%),0,0)}
.slide-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,61,71,.28) 0%,rgba(0,61,71,0) 30%,rgba(0,61,71,0) 48%,rgba(0,61,71,.88) 100%)}
.slide-num{position:absolute;top:14px;left:16px;z-index:1;font-family:var(--font-num);font-variant-numeric:lining-nums;font-size:22px;color:#fff}
.slide-num::after{content:"";display:inline-block;width:26px;height:1px;background:var(--gold);vertical-align:middle;margin-left:10px}
.slide h3{position:absolute;left:16px;right:16px;bottom:14px;z-index:1;font-family:var(--font-display);font-weight:400;font-size:27px;line-height:1.14;color:#fff;text-wrap:balance}
.slide-body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.slide-body p{font-size:14.5px;line-height:1.55;color:var(--ink)}
.metas{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.meta{font-size:12px;font-weight:500;color:var(--teal-dark);background:rgba(0,138,149,.1);border-radius:999px;padding:4px 11px}
.car-ui{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 var(--pad);max-width:1080px;margin:0 auto}
.car-count{font-family:var(--font-num);font-variant-numeric:lining-nums;font-size:20px;color:var(--teal);min-width:74px}
.car-count small{font-size:14px;color:var(--muted)}
.car-dots{display:flex;gap:8px;flex:1;justify-content:center}
.car-dots button{width:8px;height:8px;padding:0;border:0;border-radius:999px;background:rgba(13,59,66,.2);transition:width .3s ease-out,background .3s ease-out;position:relative}
.car-dots button::after{content:"";position:absolute;inset:-14px -4px}
.car-dots button[aria-current="true"]{width:26px;background:var(--gold)}
.car-arrows{display:flex;gap:8px}
.car-arrows button{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;transition:background .2s ease-out,color .2s ease-out}
.car-arrows button:hover{background:var(--teal);color:#fff}
.car-arrows svg{width:18px;height:18px}
.also{margin-top:40px}
.also h4{margin:0;font-size:11.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--teal)}
.also .chip{border-color:var(--line);color:var(--ink);background:#fff}

/* ==========================================================================
   TYPES DE GROUPES — jauge 4 → 50 et cartes empilées (sticky)
   ========================================================================== */
.groups{background:#fff;padding:84px 0 60px}
.gauge{margin-top:34px;display:grid;gap:14px}
.gauge-top{display:flex;align-items:baseline;gap:12px;font-family:var(--font-num);font-variant-numeric:lining-nums;color:var(--teal)}
.gauge-top b{font-weight:400;font-size:54px;line-height:1;white-space:nowrap}
.gauge-top span{font-family:var(--font-body);font-size:13.5px;color:var(--muted);line-height:1.4}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;max-width:420px}
.dots i{display:block;aspect-ratio:1;border-radius:50%;background:rgba(13,59,66,.1);transition:background .4s ease-out,transform .4s var(--ease);transition-delay:calc(var(--i)*26ms);transform:scale(.7)}
.dots.in i{background:var(--teal);transform:none}
.dots.in i.core{background:var(--gold)}
.stack{margin-top:44px;display:grid;gap:16px}
.gcard{position:sticky;top:calc(64px + var(--i)*14px);min-height:310px;padding:26px 22px 28px;border-radius:var(--radius);box-shadow:0 -6px 24px rgba(0,61,71,.12);display:flex;flex-direction:column;gap:12px;background:var(--cream)}
.gcard:nth-child(2){background:var(--gold-pale)}
.gcard:nth-child(3){background:var(--teal);color:#fff}
.gcard:nth-child(4){background:var(--abyss);color:#fff}
.gcard .gnum{font-family:var(--font-num);font-variant-numeric:lining-nums;font-size:18px;opacity:.7}
.gcard h3{font-family:var(--font-display);font-weight:400;font-size:34px;line-height:1.1}
.gcard .gmeta{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-dark)}
.gcard:nth-child(n+3) .gmeta{color:var(--gold-light)}
.gcard p{font-size:15px;line-height:1.55}
.gcard .gfoot{margin-top:auto;padding-top:14px;border-top:1px solid currentColor;font-size:13.5px;font-weight:500;border-color:rgba(13,59,66,.18)}
.gcard:nth-child(n+3) .gfoot{border-color:rgba(255,255,255,.28)}
.case{margin-top:60px;display:grid;gap:0;background:var(--cream)}
.case-img{overflow:hidden;aspect-ratio:3/2}
.case-img img{width:100%;height:100%;object-fit:cover}
.case-body{padding:24px 22px 28px}
.case-body h3{font-family:var(--font-display);font-weight:400;font-size:28px;line-height:1.15;margin-top:10px}
.case-list{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;margin-top:20px}
.case-list b{display:block;font-family:var(--font-num);font-variant-numeric:lining-nums;font-weight:400;font-size:30px;line-height:1.05;color:var(--teal)}
.case-list span{font-size:13px;color:var(--muted);line-height:1.4;display:block;margin-top:3px}

/* ==========================================================================
   DMC — fondateurs, chiffres, prestations, déroulé
   ========================================================================== */
.dmc{background:linear-gradient(160deg,var(--teal-deep) 0%,var(--abyss) 70%);padding:84px 0}
.founders{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:34px}
.founder img{width:100%;aspect-ratio:1;object-fit:cover;filter:grayscale(1) contrast(1.05)}
.founder b{display:block;font-family:var(--font-display);font-weight:400;font-size:21px;line-height:1.2;margin-top:12px}
.founder span{display:block;font-size:12.5px;color:rgba(255,255,255,.72);line-height:1.4;margin-top:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;margin-top:44px;border-top:1px solid rgba(255,255,255,.2)}
.stat{padding:24px 12px 24px 0;border-bottom:1px solid rgba(255,255,255,.2)}
.stat:nth-child(odd){border-right:1px solid rgba(255,255,255,.2)}
.stat:nth-child(even){padding-left:18px}
.stat b{display:block;font-family:var(--font-num);font-variant-numeric:lining-nums;font-weight:400;font-size:52px;line-height:1;color:var(--gold);white-space:nowrap}
.stat b small{font-size:.42em;margin-left:.12em}
.stat span{display:block;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,.8);margin-top:8px}
.incl{margin-top:54px}
.incl h3,.steps-t{font-family:var(--font-display);font-weight:400;font-size:28px;line-height:1.15}
.incl ul{margin-top:18px;display:grid;gap:0}
.incl li{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.16);font-size:15px;line-height:1.45}
.incl li svg{flex:none;width:20px;height:20px;margin-top:2px;color:var(--gold)}
.incl .flights{margin-top:18px;font-size:14px;color:rgba(255,255,255,.75);max-width:48ch}
.steps{margin-top:54px}
.timeline{position:relative;margin-top:24px;padding-left:38px;display:grid;gap:30px}
.timeline::before,.timeline::after{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:1px;background:rgba(255,255,255,.22)}
.timeline::after{background:var(--gold);transform-origin:50% 0;transform:scaleY(var(--tp,0))}
.step{position:relative}
.step::before{content:attr(data-n);position:absolute;left:-38px;top:0;width:23px;height:23px;border-radius:50%;background:var(--abyss);border:1px solid var(--gold);color:var(--gold);font-size:11.5px;font-weight:600;display:grid;place-items:center;z-index:1}
.step b{display:block;font-weight:500;font-size:16.5px;line-height:1.35}
.step span{display:block;font-size:14px;color:rgba(255,255,255,.72);line-height:1.5;margin-top:3px}
.team-photo{margin-top:54px;overflow:hidden;aspect-ratio:16/10}
.team-photo img{width:100%;height:100%;object-fit:cover}

/* ==========================================================================
   FAQ
   ========================================================================== */
.faq{background:var(--cream);padding:84px 0}
.faq-list{margin-top:30px;border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0;font-family:var(--font-serif);font-size:20px;line-height:1.3;cursor:pointer;min-height:44px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";flex:none;width:14px;height:14px;background:linear-gradient(var(--teal),var(--teal)) 50%/100% 1.5px no-repeat,linear-gradient(var(--teal),var(--teal)) 50%/1.5px 100% no-repeat;transition:transform .3s ease-out}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 30px 22px 0;color:var(--muted);font-size:15px;max-width:60ch}

/* ==========================================================================
   FINAL — contact
   ========================================================================== */
.final{position:relative;min-height:100svh;overflow:hidden;background:var(--abyss);color:#fff;display:flex;align-items:flex-end}
.final>img{position:absolute;left:0;top:-12%;width:100%;height:124%;object-fit:cover;will-change:transform;transform:translate3d(0,calc(var(--pp,0)*10%),0)}
.final::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,61,71,.2) 0%,rgba(0,61,71,.55) 42%,rgba(0,61,71,.96) 100%)}
.final-in{position:relative;z-index:1;width:100%;padding:120px 0 calc(34px + env(safe-area-inset-bottom))}
.final .script{font-family:var(--font-script);font-size:clamp(40px,11.4vw,92px);line-height:1.15;color:var(--gold)}
:lang(el) .final .script{font-family:var(--font-serif);font-style:italic;font-size:clamp(34px,9.5vw,64px)}
.final h2{font-family:var(--font-display);font-weight:400;font-size:clamp(34px,9.4vw,60px);line-height:1.12;max-width:14ch;margin-top:6px}
.final p{margin-top:14px;color:rgba(255,255,255,.82);max-width:42ch}
.btns{display:grid;gap:10px;margin-top:28px;max-width:420px}
.btn{display:flex;align-items:center;gap:12px;min-height:54px;padding:12px 20px;border-radius:var(--radius);text-decoration:none;font-weight:500;font-size:15.5px;border:1px solid rgba(255,255,255,.4);transition:background .2s ease-out,border-color .2s ease-out}
.btn svg{width:20px;height:20px;flex:none}
.btn small{display:block;font-size:12px;font-weight:400;opacity:.75;line-height:1.3}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--abyss)}
.btn.primary:hover{background:var(--gold-light);border-color:var(--gold-light)}
.btn:not(.primary):hover{background:rgba(255,255,255,.12);border-color:#fff}
.foot{margin-top:44px;padding-top:20px;border-top:1px solid rgba(255,255,255,.2);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;font-size:11.5px;color:rgba(255,255,255,.6);line-height:1.5}
.foot img{height:38px;width:auto}

/* ==========================================================================
   TABLETTE / ORDINATEUR
   ========================================================================== */
@media(min-width:760px){
  :root{--pad:40px}
  .section,.acts,.groups,.dmc,.faq{padding-top:120px;padding-bottom:120px}
  .hero-in{padding-bottom:110px}
  .hero-sub{font-size:18px}
  .flight-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:40px;align-items:end}
  .weather{padding:64px 56px 48px;max-width:1000px;margin-left:auto;margin-right:auto}
  .bars{height:260px;gap:16px}
  .cities-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center}
  .facts,.stats{grid-template-columns:repeat(4,1fr)}
  .fact,.stat{padding-left:22px!important;border-right:1px solid rgba(255,255,255,.2)}
  .slide{flex-basis:340px}
  .car-track{padding-left:max(var(--pad),calc((100vw - 1080px)/2 + var(--pad)));padding-right:max(var(--pad),calc((100vw - 1080px)/2 + var(--pad)))}
  .stack{grid-template-columns:1fr 1fr}
  .gcard{position:relative;top:auto}
  .case{grid-template-columns:1.1fr 1fr;align-items:stretch}
  .case-img{aspect-ratio:auto}
  .founders{max-width:520px}
  .dmc-grid{display:grid;grid-template-columns:1fr 1fr;gap:64px}
  .btns{grid-template-columns:1fr 1fr;max-width:640px}
}
@media(max-width:759px){.car-arrows{display:none}}

/* Mouvement réduit : tout est affiché, sans animation */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .js .rv,.js .rv-img img{opacity:1;transform:none;clip-path:none}
  .ht-script{clip-path:none}.ht-main .ch{transform:none}
  .ht-digits{color:var(--gold)}.ht-digits .dg span{transform:translateY(calc(var(--n)*-1em))}
  .ht-year::after{transform:none}.hero-sub{opacity:1}.hero-kicker::before{width:40px}
  .hero-bg,.hero-in,.band img,.final>img,.sun{transform:none}
}
</style>
</head>

/* ==========================================================================
   OUTILS
   ========================================================================== */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const clamp = (v, min = 0, max = 1) => Math.min(max, Math.max(min, v));
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const SVG_NS = 'http://www.w3.org/2000/svg';
let currentLang = CONFIG.defaultLang;

function el(tag, attrs = {}, html = '') {
  const node = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  if (html) node.innerHTML = html;
  return node;
}

/** Durée de vol formatée (« 2 h 45 ») à partir de minutes. */
function formatFlight(minutes) {
  const h = Math.floor(minutes / 60);
  const m = String(Math.round(minutes % 60)).padStart(2, '0');
  return `${h} h ${m}`;
}

/** Valeurs injectées dans les textes ({flight}, {cities}…). */
function getTextVars() {
  return {
    flight: formatFlight(CONFIG.flightMinutes),
    cities: CONFIG.cities.length,
    min: CONFIG.groupMin,
    max: CONFIG.groupMax,
    price: CONFIG.incentivePriceFrom,
    year: CONFIG.year
  };
}

/** Lit une clé (chemin pointé accepté : « act.quad.0 ») dans la langue courante. */
function translate(key, extra = {}) {
  const read = (lang) => key.split('.').reduce((o, k) => (o == null ? o : o[k]), TRANSLATIONS[lang]);
  let value = read(currentLang);
  if (value == null) value = read(CONFIG.defaultLang);
  if (typeof value !== 'string') return value == null ? '' : value;
  const vars = { ...getTextVars(), ...extra };
  return value.replace(/\{(\w+)\}/g, (m, name) => (name in vars ? vars[name] : m));
}

/* ==========================================================================
   RENDU — construit une fois le DOM à partir de CONFIG (textes via data-i18n)
   ========================================================================== */
function renderSunRays() {
  const g = $('#sunRays');
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    const r1 = 60, r2 = i % 2 ? 78 : 92;
    const line = document.createElementNS(SVG_NS, 'line');
    line.setAttribute('x1', 100 + Math.cos(a) * r1); line.setAttribute('y1', 100 + Math.sin(a) * r1);
    line.setAttribute('x2', 100 + Math.cos(a) * r2); line.setAttribute('y2', 100 + Math.sin(a) * r2);
    g.appendChild(line);
  }
}

function renderWeather() {
  const { min, max } = CONFIG.weatherScale;
  const bars = $('#weatherBars');
  CONFIG.weather.forEach((w, i) => {
    const h = Math.round(((w.temp - min) / (max - min)) * 100);
    bars.appendChild(el('div', { class: 'bar' + (w.best ? ' best' : ''), style: `--h:${h};--i:${i}` },
      `<b>${w.temp}°</b><i></i><span data-i18n="months.${w.month}"></span>`));
  });
  $('#wxSea').textContent = `${CONFIG.seaTempOctober} °C`;
  $('#wxMid').textContent = `${CONFIG.midSeasonRange[0]} – ${CONFIG.midSeasonRange[1]} °C`;
}

function renderCities() {
  const chips = $('#cityChips');
  CONFIG.countries.forEach((country, ci) => {
    const block = el('div', { class: 'country rv', style: `--d:${ci}` }, `<h4 data-i18n="countryNames.${country}"></h4>`);
    const list = el('div', { class: 'chips' });
    CONFIG.cities.filter((c) => c.country === country)
      .forEach((c) => list.appendChild(el('span', { class: 'chip', 'data-i18n': `cityNames.${c.id}` })));
    block.appendChild(list);
    chips.appendChild(block);
  });
  // Liaisons sur la carte : un arc par ville, vers Corfou
  const routes = $('#mapRoutes');
  const { x: cx, y: cy } = CONFIG.corfuOnMap;
  CONFIG.cities.forEach((c, i) => {
    const mx = (c.x + cx) / 2, my = (c.y + cy) / 2;
    const lift = Math.hypot(cx - c.x, cy - c.y) * 0.22;
    const path = document.createElementNS(SVG_NS, 'path');
    path.setAttribute('class', 'route');
    path.setAttribute('pathLength', '1');
    path.setAttribute('d', `M${c.x},${c.y} Q${mx + lift * 0.5},${my - lift} ${cx},${cy}`);
    path.style.setProperty('--i', i);
    routes.appendChild(path);
    const dot = document.createElementNS(SVG_NS, 'circle');
    dot.setAttribute('class', 'city');
    dot.setAttribute('cx', c.x); dot.setAttribute('cy', c.y); dot.setAttribute('r', 6.5);
    dot.style.setProperty('--i', i);
    routes.appendChild(dot);
  });
}

function renderCarousel(root) {
  const name = root.dataset.carousel;
  const items = CONFIG.activities[name];
  const track = el('div', { class: 'car-track', tabindex: '0' });
  items.forEach((a, i) => {
    const metas = a.meta.map(([tpl, v]) => `<span class="meta" data-i18n="${tpl}" data-v="${v}"></span>`).join('');
    track.appendChild(el('article', { class: 'slide' },
      `<div class="slide-img"><img src="${CONFIG.imgPath}${a.img}" alt="" loading="lazy" decoding="async">
         <span class="slide-num">${String(i + 1).padStart(2, '0')}</span>
         <h3 data-i18n="act.${a.id}.0"></h3></div>
       <div class="slide-body"><p data-i18n="act.${a.id}.1"></p><div class="metas">${metas}</div></div>`));
  });
  const ui = el('div', { class: 'car-ui' },
    `<div class="car-count"><span class="cur">01</span> <small>/ ${String(items.length).padStart(2, '0')}</small></div>
     <div class="car-dots">${items.map((_, i) => `<button type="button" aria-label="${i + 1}"></button>`).join('')}</div>
     <div class="car-arrows">
       <button type="button" class="prev" data-i18n-aria="prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
       <button type="button" class="next" data-i18n-aria="next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
     </div>`);
  root.append(track, ui);
}

  CONFIG.faq.forEach((key) => list.appendChild(el('details', { class: 'rv' },

/* ==========================================================================
   LANGUE — applique TRANSLATIONS à tout le DOM
   ========================================================================== */
/** Titre du hero : écriture manuscrite + lettres qui montent + année en compteur. */
function renderHeroTitle(animate) {
  const title = $('#heroTitle');
  const script = translate('heroScript'), main = translate('heroMain');
  title.setAttribute('aria-label', `${script} ${main} ${CONFIG.year}`);
  const letters = [...main].map((ch, i) => `<span class="ch" style="--i:${i}">${ch}</span>`).join('');
  const digits = [...CONFIG.year].map((d, i) => {
    const n = Number(d), steps = 4;
    let column = '';
    for (let k = steps; k >= 0; k--) column += `<b>${(n - k + 10) % 10}</b>`;
    return `<span class="dg"><span style="--n:${steps};--i:${i}">${column}</span></span>`;
  }).join('');
  title.innerHTML = `<span class="ht-script" aria-hidden="true">${script}</span>
    <span class="ht-main" aria-hidden="true">${letters}</span>
    <span class="ht-year" aria-hidden="true"><span class="ht-digits">${digits}</span></span>`;
  if (!animate) $$('*', title).forEach((n) => { n.style.animationDelay = '0s'; n.style.animationDuration = '.01s'; });
}

/** Manifeste : un <span> par mot ; les mots entourés de *…* sont mis en valeur. */
function renderManifesto() {
  const box = $('#manifestoWords');
  box.innerHTML = translate('manifesto').split(' ').map((word) => {
    const hl = /^\*.*\*[.,]?$/.test(word);
    return `<span class="w${hl ? ' hl' : ''}">${word.replace(/\*/g, '')}</span>`;
  }).join(' ');
}

function applyLanguage(lang, isFirstRun = false) {
  currentLang = TRANSLATIONS[lang] ? lang : CONFIG.defaultLang;
  document.documentElement.lang = TRANSLATIONS[currentLang].htmlLang;
  $$('[data-i18n]').forEach((n) => { n.textContent = translate(n.dataset.i18n, n.dataset.v ? { v: n.dataset.v } : {}); });
  $$('[data-i18n-html]').forEach((n) => { n.innerHTML = translate(n.dataset.i18nHtml); });
  $$('[data-i18n-aria]').forEach((n) => n.setAttribute('aria-label', translate(n.dataset.i18nAria)));
  $('#weatherBars').setAttribute('aria-label', translate('wxBarsLabel'));
  $$('#langSwitch button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === currentLang)));
  document.title = `${translate('heroScript')} ${translate('heroMain')} ${CONFIG.year} — Kerkyra Work & Play`;
  renderHeroTitle(isFirstRun);
  renderManifesto();
  if (!isFirstRun) { try { localStorage.setItem('kerkyraLang', currentLang); } catch (e) { /* stockage indisponible */ } }
  requestScrollUpdate();
}

function getInitialLanguage() {
  const fromUrl = new URLSearchParams(location.search).get('lang');
  if (fromUrl && TRANSLATIONS[fromUrl]) return fromUrl;
  try { const saved = localStorage.getItem('kerkyraLang'); if (saved && TRANSLATIONS[saved]) return saved; } catch (e) { /* ignore */ }
  return CONFIG.defaultLang;
}

/* ==========================================================================
   EFFETS AU SCROLL
   ========================================================================== */
/** Apparitions : ajoute .in quand l'élément entre dans l'écran. */
function initReveals() {
  const targets = $$('.rv, .rv-img, .bars, .map, .dots');
  if (REDUCED || !('IntersectionObserver' in window)) { targets.forEach((n) => n.classList.add('in')); return; }
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { rootMargin: '0px 0px -12% 0px', threshold: 0.12 });
  targets.forEach((n) => io.observe(n));
}

/** Compteurs (ex. 13 villes) : comptent de 0 à la valeur à l'entrée dans l'écran. */
function initCounters() {
  const nodes = $$('[data-count]');
  const run = (node) => {
    const target = Number(getTextVars()[node.dataset.count]);
    if (REDUCED) { node.textContent = target; return; }
    const start = performance.now(), duration = 1400;
    const tick = (now) => {
      const p = clamp((now - start) / duration);
      node.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };
  if (!('IntersectionObserver' in window)) { nodes.forEach(run); return; }
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => { if (e.isIntersecting) { run(e.target); io.unobserve(e.target); } });
  }, { threshold: 0.6 });
  nodes.forEach((n) => io.observe(n));
}

/** Progression d'un élément dans l'écran : 0 quand son haut atteint `from` (part de la hauteur d'écran), 1 à `to`. */
function progressOf(node, from = 1, to = 0) {
  const vh = window.innerHeight;
  const top = node.getBoundingClientRect().top;
  return clamp((from * vh - top) / ((from - to) * vh));
}

let scrollTicking = false;
function requestScrollUpdate() {
  if (scrollTicking) return;
  scrollTicking = true;
  requestAnimationFrame(() => { scrollTicking = false; updateScrollEffects(); });
}

const flightArc = $('#flightArc'), flightPlane = $('#flightPlane'), flightTime = $('#flightTime');
const flightLength = flightArc.getTotalLength();
flightArc.style.strokeDasharray = flightLength;

/** Met à jour l'arc de vol, l'avion et le chrono pour une progression p (0 → 1). */
function updateFlight(p) {
  const eased = 1 - Math.pow(1 - p, 2);
  flightArc.style.strokeDashoffset = flightLength * (1 - eased);
  const at = flightArc.getPointAtLength(flightLength * eased);
  const ahead = flightArc.getPointAtLength(Math.min(flightLength, flightLength * eased + 1));
  const angle = eased >= 1 ? 38 : Math.atan2(ahead.y - at.y, ahead.x - at.x) * 180 / Math.PI;
  flightPlane.setAttribute('transform', `translate(${at.x},${at.y}) rotate(${angle})`);
  const minutes = Math.round(CONFIG.flightMinutes * eased);
  const [h, m] = formatFlight(minutes).split(' h ');
  flightTime.innerHTML = `${h}<small>h</small>${m}`;
}

function updateScrollEffects() {
  const doc = document.documentElement;
  const vh = window.innerHeight;
  const max = doc.scrollHeight - vh;
  doc.style.setProperty('--sp', max > 0 ? clamp(window.scrollY / max) : 0);
  if (REDUCED) { updateFlight(1); $$('#manifestoWords .w').forEach((w) => w.classList.add('on')); $('#timeline').style.setProperty('--tp', 1); return; }

  // Hero : le titre s'efface, la photo recule
  $('#hero').style.setProperty('--hp', clamp(window.scrollY / vh));

  // Manifeste : les mots s'allument un à un
  const words = $$('#manifestoWords .w');
  const wp = progressOf($('#manifestoWords'), 0.86, 0.3);
  const lit = Math.round(wp * words.length);
  words.forEach((w, i) => w.classList.toggle('on', i < lit));

  // Vol : l'arc se trace
  updateFlight(progressOf($('#flight'), 0.8, 0.22));

  // Météo : le soleil se lève
  $('#weather').style.setProperty('--wp', progressOf($('#weather'), 1, 0.3));

  // Bandeaux photo : parallaxe
  $$('[data-parallax]').forEach((node) => {
    const r = node.getBoundingClientRect();
    if (r.bottom < -50 || r.top > vh + 50) return;
    node.style.setProperty('--pp', (clamp((vh - r.top) / (vh + r.height)) - 0.5).toFixed(4));
  });

  // Déroulé : la ligne se remplit
  $('#timeline').style.setProperty('--tp', progressOf($('#timeline'), 0.8, 0.3));
}

/* ==========================================================================
   CARROUSELS
   ========================================================================== */
function initActivityCarousel(root) {
  const track = $('.car-track', root);
  const slides = $$('.slide', track);
  const dots = $$('.car-dots button', root);
  const current = $('.cur', root);
  let ticking = false;

  const update = () => {
    ticking = false;
    const center = track.scrollLeft + track.clientWidth / 2;
    let active = 0, best = Infinity;
    slides.forEach((s, i) => {
      const offset = (s.offsetLeft + s.offsetWidth / 2 - center) / s.offsetWidth;
      if (Math.abs(offset) < best) { best = Math.abs(offset); active = i; }
      if (!REDUCED) {
        s.style.setProperty('--dist', clamp(Math.abs(offset)).toFixed(3));
        s.style.setProperty('--px', clamp(offset, -1, 1).toFixed(3));
      }
    });
    dots.forEach((d, i) => d.setAttribute('aria-current', String(i === active)));
    current.textContent = String(active + 1).padStart(2, '0');
    root.dataset.active = active;
  };
  const goTo = (i) => {
    const s = slides[clamp(i, 0, slides.length - 1)];
    track.scrollTo({ left: s.offsetLeft - (track.clientWidth - s.offsetWidth) / 2, behavior: REDUCED ? 'auto' : 'smooth' });
  };
  track.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } }, { passive: true });
  dots.forEach((d, i) => d.addEventListener('click', () => goTo(i)));
  $('.prev', root).addEventListener('click', () => goTo(Number(root.dataset.active) - 1));
  $('.next', root).addEventListener('click', () => goTo(Number(root.dataset.active) + 1));
  track.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(Number(root.dataset.active) + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(Number(root.dataset.active) - 1); }
  });
  window.addEventListener('resize', update);
  update();
}

/* ==========================================================================
   DÉMARRAGE
   ========================================================================== */
function init() {
  document.documentElement.classList.add('js');
  renderSunRays();
  renderWeather();
  renderCities();
  renderFacts();
  $$('[data-carousel]').forEach(renderCarousel);
  renderAlso();
  renderGroups();
  renderDmc();
  renderFaq();
  renderContact();
  applyLanguage(getInitialLanguage(), true);
  $$('[data-carousel]').forEach(initActivityCarousel);
  initReveals();
  initCounters();
  $$('#langSwitch button').forEach((b) => b.addEventListener('click', () => applyLanguage(b.dataset.lang)));
  window.addEventListener('scroll', requestScrollUpdate, { passive: true });
  window.addEventListener('resize', requestScrollUpdate);
  updateScrollEffects();
}
init();
</script>
