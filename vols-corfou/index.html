let lang="fr";
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const nameOf=(f,l)=>(f.vn&&f.vn[l])?f.vn[l]:f.v;
function fmtSeason(fin,l){const y=2026,mo=MON[l][fin.m];
  if(fin.approx)return UNTILM[l]+" "+mo+" "+y;
  if(fin.qual==='late')return LATE[l]+" "+mo+" "+y;
  if(fin.qual==='around')return "≈ "+fin.d+" "+mo+" "+y;
  return UNTIL[l]+" "+fin.d+" "+mo+" "+y;}
function timeText(seg,l){let s=seg.slots.map(x=>SLOT[x][l]).join(' → ');
  if(seg.range)s+=" (≈ "+seg.range+")"; else if(seg.from)s+=" ("+FROMW[l]+" "+seg.from+")"; return s;}
function daysHtml(days,l){return '<div class="days">'+DOW[l].map((d,i)=>'<span class="day'+(days.includes(i)?' on':'')+'">'+d+'</span>').join('')+'</div>';}
function card(f,l){const t=T[l],cn=nameOf(f,l),co=CORFOU[l];
  const dir=(head,seg)=>'<div class="dir"><div class="dirh"><span class="tag'+(seg===f.ret?' ret':'')+'">'+(seg===f.ret?t.retTag:t.outTag)+'</span>'+head+'</div>'+daysHtml(f.days,l)+'<div class="drow"><b>'+t.dTime+'</b> '+timeText(seg,l)+'</div></div>';
  return '<div class="flight"><div class="pays">'+PAYS[f.pays][l]+'</div><h3>'+cn+' ⇄ '+co+'</h3><span class="airline">'+f.comp+'</span>'
   +'<div class="dirs">'+dir(cn+' → '+co,f.out)+dir(co+' → '+cn,f.ret)+'</div>'
   +'<div class="meta"><span class="price">'+t.priceFrom.replace('{p}','<span class="amt">'+f.prix+'</span>')+'</span><br>'
   +'<b>'+t.labelDur+' :</b> '+f.dur+' · <b>'+t.labelSeason+' :</b> '+fmtSeason(f.fin,l)+'</div></div>';
}
const grid=$('#grid'),countEl=$('#count'),fVille=$('#fVille'),fJour=$('#fJour');
function render(){const vi=fVille.value,ji=fJour.value,t=T[lang];
  if(vi===""&&ji===""){grid.innerHTML='<div class="empty">'+t.selectPrompt+'</div>';countEl.textContent='';$$('.mk').forEach(g=>g.classList.remove('active'));return;}
  let list=FLIGHTS.slice();
  if(vi==="PARIS")list=list.filter(f=>f.group==="Paris");else if(vi!=="")list=list.filter(f=>f.code===vi);
  if(ji!=="")list=list.filter(f=>f.days.includes(parseInt(ji)));
  $$('.mk').forEach(g=>{const c=g.getAttribute('data-code');g.classList.toggle('active',vi!=="" && c===vi);});
  if(list.length===0){grid.innerHTML='<div class="empty">—</div>';countEl.textContent='';return;}
  countEl.textContent=(list.length>1?t.countMany:t.countOne).replace('{n}',list.length);
  grid.innerHTML=list.map(f=>card(f,lang)).join('');
}
function buildVilleSelect(){const t=T[lang],prev=fVille.value;let h='<option value="">'+t.allVilles+'</option>';
  const by={};FLIGHTS.forEach(f=>{(by[f.pays]=by[f.pays]||[]).push(f);});
  Object.keys(by).forEach(p=>{h+='<optgroup label="'+PAYS[p][lang]+'">';
    if(p==="France")h+='<option value="PARIS">'+t.parisCombo+'</option>';
    by[p].forEach(f=>{h+='<option value="'+f.code+'">'+nameOf(f,lang)+' ('+f.code+')</option>';});h+='</optgroup>';});
  fVille.innerHTML=h;fVille.value=prev;}
function buildJourSelect(){const t=T[lang],prev=fJour.value;let h='<option value="">'+t.allJours+'</option>';
  const full={fr:["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"],en:["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],el:["Δευτέρα","Τρίτη","Τετάρτη","Πέμπτη","Παρασκευή","Σάββατο","Κυριακή"]};
  full[lang].forEach((d,i)=>{h+='<option value="'+i+'">'+d+'</option>';});fVille;fJour.innerHTML=h;fJour.value=prev;}
function buildMarkers(){const mk=$('#markers');mk.innerHTML='';MAP.forEach(m=>{
  const g=document.createElementNS("http://www.w3.org/2000/svg","g");g.setAttribute("class","mk");g.setAttribute("data-code",m.code);
  var lft=m.side==='L';g.innerHTML='<circle cx="'+m.x+'" cy="'+m.y+'" r="6" fill="#028a95" stroke="#fff" stroke-width="1.6"/><text x="'+(m.x+(lft?-11:11))+'" y="'+(m.y+4)+'" text-anchor="'+(lft?'end':'start')+'">'+m.m[lang]+'</text>';
  g.addEventListener('click',()=>{fVille.value=m.code;render();$('#toolCard').scrollIntoView({behavior:'smooth',block:'nearest'});});mk.appendChild(g);});}
function applyI18n(){document.documentElement.lang=lang;const t=T[lang];
  $$('[data-i18n]').forEach(e=>{const k=e.getAttribute('data-i18n');if(t[k]!==undefined)e.textContent=t[k];});
  $$('[data-i18n-ph]').forEach(e=>{const k=e.getAttribute('data-i18n-ph');if(t[k]!==undefined)e.placeholder=t[k];});}
function setLang(l){lang=l;$$('#langsw button').forEach(b=>b.classList.toggle('on',b.getAttribute('data-lang')===l));
  applyI18n();buildVilleSelect();buildJourSelect();buildMarkers();render();}
$$('#langsw button').forEach(b=>b.onclick=()=>setLang(b.getAttribute('data-lang')));
fVille.onchange=render;fJour.onchange=render;$('#reset').onclick=()=>{fVille.value="";fJour.value="";render();};
setLang('fr');

// email gate + devis (mailto hello@kerkyra.fr)
const valid=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e),gate=$('#gate');
const closeGate=()=>gate.classList.add('hidden');
$('#gateSkip').onclick=closeGate;$('#gateContinue').onclick=closeGate;
$('#gateIg').addEventListener('click',closeGate);
gate.addEventListener('click',e=>{if(e.target===gate)closeGate();});
const devis=$('#devis');function openDevis(e){if(e)e.preventDefault();devis.classList.remove('hidden');}
$('#openDevis').onclick=openDevis;$('#topDevis').onclick=openDevis;$('#devisClose').onclick=()=>devis.classList.add('hidden');
devis.addEventListener('click',e=>{if(e.target===devis)devis.classList.add('hidden');});
$('#dSend').onclick=()=>{const ml=$('#dMail').value.trim();if(!valid(ml)){$('#derr').textContent=T[lang].dErr;return;}$('#derr').textContent="";
  const body=encodeURIComponent("Nom: "+$('#dNom').value+"\nEmail: "+ml+"\nDates: "+$('#dDates').value+"\nPax: "+$('#dPax').value+"\n\n"+$('#dMsg').value);
  window.location.href="mailto:hello@kerkyra.fr?subject="+encodeURIComponent(T[lang].mailDevisSubj)+"&body="+body;};
</script>
